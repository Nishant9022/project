<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Multi-cloud DevOps delivery architecture</title><desc id="desc">Developer commits code to GitHub. GitHub Actions tests the Flask app and builds a Docker image, publishing it to GHCR. Terraform provisions separate AWS or Azure infrastructure examples. Kubernetes on EKS or AKS can pull and run the image, with health probes and monitoring.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526581"/></marker></defs><rect width="1200" height="660" rx="24" fill="#f5f8fc"/><text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172b4d">Multi-Cloud DevOps Automation Platform</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="120" width="200" height="105" rx="14" fill="#fff" stroke="#526581" stroke-width="2"/><text x="155" y="160" font-size="20" font-weight="bold" fill="#172b4d">Developer</text><text x="155" y="190" font-size="15" fill="#526581">Git push / Pull Request</text><rect x="350" y="120" width="220" height="105" rx="14" fill="#e8f1ff" stroke="#2874c7" stroke-width="2"/><text x="460" y="160" font-size="20" font-weight="bold" fill="#174a7e">GitHub Actions</text><text x="460" y="190" font-size="15" fill="#526581">Tests · Docker build</text><rect x="665" y="120" width="200" height="105" rx="14" fill="#fff2df" stroke="#d58b25" stroke-width="2"/><text x="765" y="160" font-size="20" font-weight="bold" fill="#81500d">GHCR</text><text x="765" y="190" font-size="15" fill="#526581">Container image</text><rect x="960" y="120" width="190" height="105" rx="14" fill="#e8f7ef" stroke="#29965c" stroke-width="2"/><text x="1055" y="160" font-size="20" font-weight="bold" fill="#17643d">Kubernetes</text><text x="1055" y="190" font-size="15" fill="#526581">Deploy / rollout</text><path d="M255 172 H345 M570 172 H660 M865 172 H955" stroke="#526581" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="90" y="355" width="440" height="180" rx="16" fill="#fff" stroke="#e59a31" stroke-width="2"/><text x="310" y="395" font-size="22" font-weight="bold" fill="#81500d">AWS environment example</text><text x="310" y="435" font-size="17" fill="#526581">Terraform · VPC · Subnets · Routing</text><text x="310" y="470" font-size="17" fill="#526581">Amazon EKS target (configure separately)</text><text x="310" y="505" font-size="15" fill="#526581">CloudWatch / logs / alarms</text><rect x="670" y="355" width="440" height="180" rx="16" fill="#fff" stroke="#2995d6" stroke-width="2"/><text x="890" y="395" font-size="22" font-weight="bold" fill="#145b86">Azure environment example</text><text x="890" y="435" font-size="17" fill="#526581">Terraform · Resource Group · VNet · Subnets</text><text x="890" y="470" font-size="17" fill="#526581">Azure Kubernetes Service target (configure separately)</text><text x="890" y="505" font-size="15" fill="#526581">Azure Monitor / logs / alerts</text><path d="M1055 225 V285 H310 V350 M1055 285 H890 V350" stroke="#526581" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/><text x="600" y="610" text-anchor="middle" font-size="15" fill="#526581">Separate cloud examples · apply only after reviewing credentials, security and estimated cost</text></g></svg>