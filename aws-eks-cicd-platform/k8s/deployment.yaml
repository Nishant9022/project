apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-api
  template:
    metadata:
      labels:
        app: retail-api
    spec:
      containers:
        - name: retail-api
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/retail-api:REPLACE_ME
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: retail-api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: retail-api
spec:
  selector:
    app: retail-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
